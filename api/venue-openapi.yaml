openapi: 3.0.3
info:
  title: Venue Service API
  version: 0.1.0
  description: API сервиса заведения (принимает заказы от kitchen-api; управление меню/статусами — имитация действий персонала заведения, т.к. своего UI у заведения нет)
servers:
  - url: http://localhost:8081
    description: Локально через docker compose
paths:
  /menu:
    get:
      operationId: listMenu
      summary: Меню заведения (нужен kitchen-api разово при онбординге / как резервная сверка — основной путь синхронизации — вебхук ниже)
      responses:
        "200":
          description: Список товаров (без убранных — removed_at IS NULL)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
    post:
      operationId: addMenuItem
      summary: Добавить товар в меню; после сохранения вызывает вебхук PUT /internal/venues/{venueId}/menu/{itemId} на kitchen-api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMenuItemRequest"
      responses:
        "201":
          description: Товар добавлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"

  /menu/{itemId}:
    patch:
      operationId: updateMenuItem
      summary: Изменить товар (цена/описание) или выключить (is_available=false); после сохранения вызывает тот же вебхук синхронизации
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMenuItemRequest"
      responses:
        "200":
          description: Товар обновлён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removeMenuItem
      summary: Убрать товар из меню (soft delete — устанавливает removed_at); после сохранения вызывает тот же вебхук синхронизации
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "204":
          description: Товар убран из меню
        "404":
          $ref: "#/components/responses/NotFound"

  /orders:
    post:
      operationId: receiveOrder
      summary: Принять новый заказ от kitchen-api; автоматическая проверка наличия каждой позиции
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiveOrderRequest"
      responses:
        "201":
          description: Заказ принят (status=accepted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueOrder"
        "409":
          description: Заказ отклонён — не хватает одной или нескольких позиций
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnavailableItemsError"

  /orders/{kitchenOrderId}/status:
    patch:
      operationId: updateOrderStatus
      summary: >
        Сменить статус заказа. Вызывается менеджером заведения вручную
        (имитация персонала — cooking/ready/cancelled_by_venue), либо
        самим kitchen-api при отмене пользователем (status=cancelled_by_user).
      parameters:
        - $ref: "#/components/parameters/KitchenOrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusRequest"
      responses:
        "200":
          description: Статус обновлён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueOrder"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Недопустимый переход статуса (например, заказ уже доставлен)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    KitchenOrderId:
      name: kitchenOrderId
      in: path
      required: true
      description: ID заказа в системе kitchen-api (используется как единственный идентификатор заказа и на стороне venue-service)
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    MenuItem:
      type: object
      required: [id, name, price, isAvailable]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price:
          type: string
          description: Денежная сумма как строка (NUMERIC(10,2) в БД)
          example: "350.00"
        isAvailable:
          type: boolean

    AddMenuItemRequest:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: string
          example: "350.00"

    UpdateMenuItemRequest:
      type: object
      description: Частичное обновление — все поля опциональны
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: string
        isAvailable:
          type: boolean

    OrderItemInput:
      type: object
      required: [itemId, quantity]
      properties:
        itemId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1

    ReceiveOrderRequest:
      type: object
      required: [kitchenOrderId, items]
      properties:
        kitchenOrderId:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItemInput"
        comment:
          type: string

    UpdateOrderStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [cooking, ready, cancelled_by_venue, cancelled_by_user]

    VenueOrder:
      type: object
      required: [kitchenOrderId, status, updatedAt]
      properties:
        kitchenOrderId:
          type: string
          format: uuid
        status:
          type: string
          enum: [accepted, rejected, cooking, ready, cancelled_by_venue, cancelled_by_user]
        updatedAt:
          type: string
          format: date-time

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

    UnavailableItemsError:
      type: object
      required: [message, unavailableItemIds]
      properties:
        message:
          type: string
        unavailableItemIds:
          type: array
          items:
            type: string
            format: uuid
